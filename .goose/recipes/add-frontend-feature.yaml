version: "1.0.0"
title: "Add Frontend Feature"
description: >
  Add a new UI feature or component to the Upwork Buddy Chrome extension/bookmarklet.
  Generates the TypeScript class, HTML rendering methods, CSS styles, state integration,
  and wires it into the main application following the project's established patterns
  (class-based modules, DOM manipulation, StorageAdapter for persistence, StateManager
  for state management).

parameters:
  - key: feature_name
    input_type: string
    requirement: required
    description: "Name of the new feature, e.g. 'JobHistory' or 'SettingsPanel'"

  - key: feature_description
    input_type: string
    requirement: required
    description: "What this feature does, e.g. 'Shows a paginated list of previously analyzed jobs'"

  - key: needs_api
    input_type: boolean
    requirement: optional
    default: "false"
    description: "Whether this feature needs a new backend API endpoint"

  - key: needs_storage
    input_type: boolean
    requirement: optional
    default: "false"
    description: "Whether this feature needs to persist data via StorageAdapter"

instructions: |
  You are adding a new frontend feature to the Upwork Buddy browser extension. Follow the
  project's established conventions precisely.

  ## Architecture Context
  - Frontend code lives in `js/src/` and is built with esbuild (`js/scripts/build-extension.mjs`).
  - Entry point: `js/src/main.ts` — the `UpworkBuddy` class orchestrates everything.
  - UI components are classes in `js/src/ui/` that accept a DOM container element in their
    constructor and render HTML into it. See `modal.ts`, `buttons.ts`, `profile-config.ts`,
    `projects-list.ts` for patterns.
  - State management: `js/src/state.ts` — `StateManager` class holds profile and cache data,
    communicates with `ApiClient` for API calls and `StorageAdapter` for persistence.
  - API client: `js/src/api.ts` — `ApiClient` class wraps `fetch()` calls to the Go backend.
  - Types: `js/src/types.ts` — all interfaces and the `CONFIG` constant.
  - Storage: `js/src/storage.ts` — `StorageAdapter` handles chrome.storage and localStorage fallback.
  - Job extraction: `js/src/job-extractor.ts` — `JobExtractor` scrapes job data from the Upwork DOM.
  - Utils: `js/src/utils.ts` — `renderAnalysis()`, `escapeHtml()`, `getTimeAgo()`.
  - Styles: `js/src/styles.ts` — `injectStyles()` adds a `<style>` block to the page.
  - The build produces `js/dist/content.js` which is loaded as a Chrome content script.

  ## Conventions
  - Use TypeScript classes, not functions or React components.
  - Render HTML via template literals with `escapeHtml()` for any dynamic content.
  - Use `CONFIG.apiBaseUrl` and `CONFIG.profileApiEndpoint` for API URLs (from types.ts).
  - Log with emoji prefixes: ✅ success, ❌ error, 🔍 search, 📥 input, 📤 output.
  - Handle both Chrome extension and bookmarklet contexts (StorageAdapter abstracts this).
  - Never use `alert()` — use the Modal component for UI feedback.
  - Use the `respondWithJSON` pattern for any new API endpoints.

  ## Steps
  1. Read the existing UI files in `js/src/ui/` to absorb the component patterns.
  2. Create a new file `js/src/ui/{{ feature_name | lower | replace(' ', '-') }}.ts` with a class
     that follows the established pattern:
     - Constructor takes dependencies (StateManager, DOM container, etc.)
     - A `render()` method that builds and inserts HTML
     - Event handlers wired via inline `onclick` or `addEventListener`
     - Proper error handling with user-friendly messages
  3. If `needs_storage` is true, add new storage keys to `StorageAdapter` following the existing
     pattern (PROFILE_STORAGE_KEY, CACHE_STORAGE_KEY).
  4. If `needs_api` is true, add the API method to `ApiClient` and add any new types to `types.ts`.
  5. Wire the new component into `main.ts` — instantiate it, add any necessary buttons via `ButtonManager`.
  6. Add any new CSS rules to `styles.ts`.
  7. Run `cd js && npm run type-check` to verify TypeScript compiles.

  ## Feature details
  - Name: {{ feature_name }}
  - Description: {{ feature_description }}
  - Needs backend API: {{ needs_api }}
  - Needs persistent storage: {{ needs_storage }}

activities:
  - "message: 🎨 I'll build the **{{ feature_name }}** feature following the extension's class-based patterns."
  - "Create just the UI component class (skip wiring and storage)"
  - "Also add a new backend API endpoint for it"
  - "Also add storage persistence with StorageAdapter"
  - "Wire it into main.ts and add buttons"