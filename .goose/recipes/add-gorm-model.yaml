version: "1.0.0"
title: "Add GORM Model & Migration"
description: >
  Add a new database model to the Upwork Buddy Go backend using GORM, update the Atlas
  schema loader, and generate the database migration. Follows the project's established
  patterns (schema.go for models, loader/main.go for Atlas, .air.toml for config).

parameters:
  - key: model_name
    input_type: string
    requirement: required
    description: "Name of the new model in PascalCase, e.g. 'JobBookmark' or 'AnalysisHistory'"

  - key: model_fields
    input_type: string
    requirement: required
    description: "Comma-separated field definitions, e.g. 'Title:string,URL:string,AnalyzedAt:*time.Time,UserID:*uint'"

  - key: model_description
    input_type: string
    requirement: required
    description: "What this model represents, e.g. 'Stores bookmarks of jobs a user wants to track'"

  - key: has_relationships
    input_type: boolean
    requirement: optional
    default: "false"
    description: "Whether this model has foreign key relationships to other models"

instructions: |
  You are adding a new GORM model to the Upwork Buddy database layer. Follow the project's
  established conventions precisely.

  ## Architecture Context
  - Database service: `internal/database/service/database.go` — singleton `DatabaseService` interface
    with `Health()`, `Close()`, `GetDB()`, `GetGorm()` methods. Uses both `database/sql` and `gorm.DB`.
  - Models: `internal/database/service/schema.go` — all GORM models live here. Existing models:
    `User`, `Job`, `Profile`, `PortfolioItem`. Each has `ID uint`, `CreatedAt time.Time`,
    `UpdatedAt time.Time` fields, and uses `gorm` struct tags for column types.
  - Atlas loader: `internal/database/service/loader/main.go` — must include every model struct in
    the `gormschema.New("postgres").Load(...)` call for migrations to be generated.
  - Atlas config: `atlas.hcl` at project root — defines the migration directory, dev database, and
    format. Migrations live in `internal/database/migrations/app/`.
  - Current connection: PostgreSQL via pgx driver, GORM with `schema.NamingStrategy{TablePrefix: "public."}`.
  - Migrations: `make diff` runs `atlas migrate diff --env app`, `make apply` runs `atlas migrate apply --env app`.
  - Docker: `docker-compose.yml` runs Postgres 15-alpine on port 5443 with Atlas for migrations.

  ## Model Conventions
  - Use `gorm:"primaryKey;autoIncrement"` for `ID uint`.
  - Use `gorm:"type:text"` for string fields (not varchar).
  - Use `gorm:"type:timestamp(3);default:CURRENT_TIMESTAMP;not null"` for `CreatedAt`.
  - Use `gorm:"type:timestamp(3);not null"` for `UpdatedAt`.
  - Use `gorm:"index"` for foreign keys.
  - Pointer types (`*uint`, `*time.Time`) for nullable fields.
  - Foreign keys use `gorm:"foreignKey:FieldName"` tags.
  - Import `"time"` and `"ariga.io/atlas-provider-gorm/gormschema"` (blank import in loader).

  ## Steps
  1. Read `internal/database/service/schema.go` to see existing model patterns.
  2. Add the new model struct to `schema.go` with proper GORM tags.
  3. Update `internal/database/service/loader/main.go` to include the new model in the `Load()` call.
  4. Run `atlas migrate diff --env app` to generate the migration.
  5. Run `atlas migrate apply --env app` (or `make apply`) to apply it.
  6. Verify by running `go test ./internal/database/... -v`.
  7. If `has_relationships` is true, also add the inverse relationship tags on the related models.

  ## Model details
  - Name: {{ model_name }}
  - Fields: {{ model_fields }}
  - Description: {{ model_description }}
  - Has relationships: {{ has_relationships }}

activities:
  - "message: 🗄️ I'll add the **{{ model_name }}** model with fields ({{ model_fields }}) and generate the migration."
  - "Just add the model to schema.go (skip migration generation)"
  - "Also add API endpoints that use this model"
  - "Write unit tests for the new model"