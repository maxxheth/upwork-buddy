# Upwork Buddy — Template Registry
# Each template category defines documentation resources and agent blueprints.
# The system scrapes docs, feeds them to the LLM, and generates agent configurations
# for Claude Code, Goose, Codex, or GitHub Copilot.

templates:
  - name: "laravel-react-inertia"
    display_name: "Laravel + React + Inertia.js"
    description: "Full-stack framework combining Laravel 13 backend with React frontend via Inertia.js — routes, Eloquent ORM, Blade layouts, React components, and Inertia shared state"
    icon: "🔴⚛️"
    docs:
      - url: "https://laravel.com/docs/11.x/routing"
        label: "Routing"
      - url: "https://laravel.com/docs/11.x/eloquent"
        label: "Eloquent ORM"
      - url: "https://laravel.com/docs/11.x/migrations"
        label: "Migrations"
      - url: "https://inertiajs.com/pages"
        label: "Inertia Pages"
      - url: "https://inertiajs.com/forms"
        label: "Inertia Forms"
      - url: "https://inertiajs.com/shared-data"
        label: "Shared Data"
      - url: "https://react.dev/learn"
        label: "React Learn"
    agent_blueprints:
      - name: "inertia-page-agent"
        title: "Inertia Page Agent"
        description: "Creates a new Inertia page with server-side route, controller method, React page component, and shared props. Use when adding a new page to a Laravel + React + Inertia app."
      - name: "eloquent-model-agent"
        title: "Eloquent Model Agent"
        description: "Creates an Eloquent model with migration, factory, seeder, and relationships. Use when adding a new database entity to a Laravel app."
      - name: "laravel-api-agent"
        title: "Laravel API Agent"
        description: "Scaffolds a Laravel API route with controller, request validation, resource response, and test. Use when adding a new REST endpoint."
      - name: "react-component-agent"
        title: "React Component Agent"
        description: "Creates a functional React component with TypeScript, props interface, and Inertia integration. Use when building UI components for an Inertia-powered app."
      - name: "laravel-middleware-agent"
        title: "Laravel Middleware Agent"
        description: "Creates Laravel middleware with registration, request filtering, and tests. Use when adding auth, CORS, rate limiting, or request transformation layers."
      - name: "laravel-test-agent"
        title: "Laravel Test Agent"
        description: "Writes feature or unit tests following Laravel conventions with factories and assertions. Use when you need test coverage for existing or new code."

